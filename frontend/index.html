<!DOCTYPE html>
<html>
<head>
  <title>Maximum Flow Visualizer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
</head>
<body>
  <div id="header">
    <h1>Maximum Flow Visualizer - Ford-Fulkerson</h1>
  </div>
  
  <div id="controls">
    <div class="node-selection">
      <span>Source:</span>
      <select id="source-select" class="node-select"></select>
      <span>Sink:</span>
      <select id="sink-select" class="node-select"></select>
    </div>
    <button id="calculate-btn" onclick="calculateMaxFlow()">Calculate Max Flow</button>
    <button id="reset-btn" onclick="resetGraph()">Reset Graph</button>
    <button id="new-graph-btn" onclick="loadNewGraph()">New Graph</button>
  </div>
  
  <div id="legend">
    <div class="legend-header">Legend:</div>
    <div class="legend-item"><span class="color-box source"></span> Source Node</div>
    <div class="legend-item"><span class="color-box sink"></span> Sink Node</div>
    <div class="legend-item"><span class="color-box critical"></span> Critical Node</div>
    <div class="legend-item"><span class="color-box flow-node"></span> Flow Node</div>
    <div class="legend-item"><span class="color-box max-path"></span> Max Flow Path</div>
    <div class="legend-item"><span class="color-box saturated"></span> Saturated Edge</div>
    <div class="legend-item"><span class="color-box bottleneck"></span> Blocked/Unused Edge</div>
  </div>
  
  <div id="cy"></div>
  
  <script src="app.js"></script>
</body>
</html>
